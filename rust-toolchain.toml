# Pin nightly because the cargo-first build relies on -Z bindeps
# (artifact-dependencies) to depend on host tools (arora-module-cli) from
# crates that cross-compile for wasm32-wasip2, the guests' target.
# See docs/building.md (Artifact dependencies) and docs/design_decisions.md
# (`-Z bindeps`).
[toolchain]
channel = "nightly-2026-06-03"
components = ["rustfmt", "clippy", "rust-src"]
targets = [
  "wasm32-wasip2",
]

