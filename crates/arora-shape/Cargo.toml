[package]
name = "arora-shape"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Shapes, typed paths and Vizij's value vocabulary over Arora's Value (the geometry types of arora-geometry, color, records and enumerations), with coercion, write batches and the graph-spec JSON forms."
repository = "https://github.com/semio-ai/arora-sdk"
readme = "README.md"
keywords = ["arora", "value", "shape", "robotics"]
categories = ["science::robotics", "data-structures"]

[dependencies]
arora-geometry = { path = "../arora-geometry", version = "1" }
arora-types = { path = "../arora-types", version = "3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hashbrown = { version = "0.17", features = ["serde"] }
uuid = "1"
