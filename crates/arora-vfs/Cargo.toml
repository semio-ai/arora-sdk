[package]
name = "arora-vfs"
version = "0.1.2"
edition = "2021"
description = "A minimal in-memory virtual filesystem (files and directories) for the Arora runtime."
license = "Apache-2.0"

[dependencies]
async-recursion = "1"
derive_more = { version = "2", features = ["display"] }
serde = { version = "1", features = ["derive", "rc"] }
sha2 = "0.11"
