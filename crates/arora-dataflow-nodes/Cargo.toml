[package]
name = "arora-dataflow-nodes"
version = "2.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Arora's dataflow nodes: the node vocabulary as the functions of @arora/dataflow, @arora/geometry and @arora/kinematics, computing on Arora's values, for a loader to put on a behavior tree."
repository = "https://github.com/semio-ai/arora-sdk"
readme = "README.md"
keywords = ["arora", "node", "dataflow", "behavior-tree", "robotics"]
categories = ["science::robotics", "game-engines"]

[dependencies]
arora-geometry = { path = "../arora-geometry", version = "1" }
# The behavior `Status` a task run speaks, and the function descriptions a
# function index holds.
arora-behavior = { path = "../arora-behavior", version = "10" }
arora-types = { path = "../arora-types", version = "3.9" }
hashbrown = { version = "0.17", features = ["serde"] }
k = { version = "0.32", optional = true, default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urdf-rs = { version = "0.9", optional = true }
uuid = { version = "1", features = ["serde", "v5"] }

[dev-dependencies]
arora-behavior-tree = { path = "../arora-behavior-tree", version = "10" }
arora-simple-data-store = { path = "../arora-simple-data-store", version = "3" }

[features]
default = ["urdf_ik"]
urdf_ik = ["k", "urdf-rs"]
