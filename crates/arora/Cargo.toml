[package]
name = "arora"
version = "16.0.2"
edition = "2021"
description = "The Arora device runtime: a data store, a HAL, bridges, modules and a behavior, advanced together one step at a time; and the `arora` device runner."
license = "Apache-2.0"

[lib]
name = "arora"
path = "src/lib.rs"

[[bin]]
name = "arora"
path = "src/main.rs"
# The device runner. On wasm32, build the library with --no-default-features.
required-features = ["native"]

# A device-specific runner over its own HAL. Native-only, like the binary.
[[example]]
name = "device"
required-features = ["native"]

[features]
default = ["native", "tui"]
# The native engine hosts (wasmtime, dynamic libraries), the local bridge, the
# operator flow and the binary. The wasm32 build leaves it off: the browser host
# is selected by target cfg.
native = [
    "dep:arora-bridge-ws",
    "dep:env_logger",
    "dep:async-trait",
    "dep:clap",
    "dep:dirs",
    "dep:serde_json",
    "arora-engine/wasmtime-host",
    "arora-engine/native-host",
]
# The Semio Studio connection (`arora::studio`): enrollment, credentials and the
# Zenoh connector. Opt-in; a binary built with it connects unless run with
# --no-studio.
studio-bridge = [
    "native",
    "dep:arora-studio-bridge-client",
    "dep:rustls",
]
# The terminal operator UI (`arora::tui`), used by the binary on an interactive
# terminal. An embedder with its own UI builds with default-features = false and
# "native".
tui = ["native", "dep:ratatui", "dep:sysinfo", "dep:env_filter"]

[dependencies]
arora-engine = { path = "../arora-engine", version = "7", default-features = false }
arora-behavior-tree = { path = "../arora-behavior-tree", version = "9.1" }
arora-behavior = { path = "../arora-behavior", version = "9.4" }
# 3.8: `PrimitiveKind::from_id`.
arora-types = { path = "../arora-types", version = "3.8" }
# 2.1: `LocalRegistry::module_at`, `missing_dependencies`.
arora-registry = { path = "../arora-registry", version = "2.1" }
arora-bridge-ws = { path = "../arora-bridge-ws", version = "7", optional = true }
anyhow = "1"
uuid = { version = "1", features = ["serde", "v4"] }
# The run loop's clock: `performance.now()` in the browser, `std::time` elsewhere.
web-time = "1"
# 4.3: `Hal::describe_keys`.
arora-hal = { path = "../arora-hal", version = "4.3" }
# 6.1: `client`, the conventions `LocalCaller` speaks.
arora-bridge = { path = "../arora-bridge", version = "6.1" }
arora-simple-data-store = { path = "../arora-simple-data-store", version = "3" }
futures = "0.3"
# Sync primitives only: the runtime-bearing tokio is native-only (below).
tokio = { version = "1", default-features = false, features = ["sync"] }
# The Semio Studio connector (feature `studio-bridge`). 11: enrollment
# (`studio::enroll`) and the device's credentials (`DeviceCredentials`).
arora-studio-bridge-client = { version = "11", optional = true }
# The per-user directory the device directory defaults to.
dirs = { version = "7", optional = true }
# A module directory's `header.json`.
serde_json = { version = "1", optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
env_logger = { version = "0.11", optional = true }
log = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
# The operator interface (`arora::operator`) is an async trait.
async-trait = { version = "0.1", optional = true }
ratatui = { version = "0.30", optional = true }
# The terminal UI's own-process CPU indicator.
sysinfo = { version = "0.40", default-features = false, features = ["system"], optional = true }
# RUST_LOG filtering of the terminal UI's log pane.
env_filter = { version = "2", optional = true }

# The native async runtime: the run loop's metronome, `#[tokio::main]`, spawned
# servers. On wasm32 the metronome sleeps on a JS timer and the embedder brings
# the executor.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# The run loop's metronome on wasm32: a `setTimeout`-backed sleep.
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.4", features = ["futures"] }

[dev-dependencies]
async-trait = "0.1"
# `test-util`: the operator tests pause time to elapse the access grace.
tokio = { version = "1", features = ["time", "test-util"] }
yaml_serde = "0.10"
# The guest the loading tests run (CARGO_CDYLIB_FILE_TEST_RUST_WASM_test_rust_wasm);
# `lib = true` also gives the tests its declaration, the header it loads with.
test-rust-wasm = { path = "../../modules/test-rust-wasm", artifact = "cdylib", target = "wasm32-wasip2", lib = true }

# The reload tests lay out their guests' result buffers.
arora-buffers = { path = "../arora-buffers", version = "3" }

# The local bridge tests' WebSocket client.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
serde_json = "1"
tokio-tungstenite = "0.30"

# The reload measurement reads the kernel's `proc_pid_rusage`.
[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2"

# The metronome tests also run in a browser.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
