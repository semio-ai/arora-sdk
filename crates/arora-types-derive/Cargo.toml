[package]
name = "arora-types-derive"
version = "2.0.0"
edition = "2021"
description = "#[derive(AroraType)] — generate an arora ty::low::Type from a Rust type."
license = "MIT"
repository = "https://github.com/semio-ai/arora-engine"
homepage = "https://github.com/semio-ai/arora-engine"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["derive"] }
# Used at macro-expansion time to read `#[arora(id = "…")]` in either spelling
# (hex or thirteen emoji) and emit its bytes.
arora-id = { path = "../arora-id", version = "1" }
