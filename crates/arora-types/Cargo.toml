[package]
name = "arora-types"
version = "3.10.0"
edition = "2021"
description = "The vocabulary every part of Arora shares: values, types, calls, records and the data-store interface."
license = "Apache-2.0"
repository = "https://github.com/semio-ai/arora-sdk"
homepage = "https://github.com/semio-ai/arora-sdk"
documentation = "https://docs.rs/arora-types"
keywords = ["arora", "robotics", "types"]
categories = ["data-structures"]
# Cargo does not detect a lowercase readme on case-sensitive filesystems.
readme = "readme.md"

[lib]
# rlib only: the wasm bindings reach JS through a dependent cdylib (arora-web),
# and a cdylib here would collide on its unhashed output when built for two
# feature sets.
crate-type = ["rlib"]

[features]
# `#[derive(AroraType)]`; turn it off to drop the proc-macro dependency.
default = ["derive"]
derive = ["dep:arora-types-derive"]

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
derive_more = { version = "2", features = ["display"] }
semver = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
lazy_static = "1"
indexmap = { version = "2", features = ["serde"] }
# 2: the derive implements `AroraType::record` and `register_records`.
arora-types-derive = { path = "../arora-types-derive", version = "2", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { version = "1", features = ["js", "serde", "v4"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
pollster = "1"
serde_json = "1"
json5 = "1.3"
ron = "0.12"
pretty_assertions = "1"
yaml_serde = "0.10"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"
