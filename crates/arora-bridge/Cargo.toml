[package]
name = "arora-bridge"
version = "6.2.0"
edition = "2021"
description = "The Arora Bridge trait: the connection between an Arora runtime and a remote (e.g. Semio Studio), modelled on studio-bridge's device-client."
license = "MIT"
readme = "readme.md"
repository = "https://github.com/semio-ai/arora-sdk"
homepage = "https://github.com/semio-ai/arora-sdk"
documentation = "https://docs.rs/arora-bridge"
keywords = ["arora", "robotics", "bridge"]
categories = ["api-bindings"]

[dependencies]
arora-types = { path = "../arora-types", version = "3.2" }
# The interpreter module's ABI (`interpreter_module`) and the behavior `Status`
# id that `client` speaks for runs. Used inside `client` only: none of its types
# appear in this crate's API.
arora-behavior = { path = "../arora-behavior", version = "9" }
async-trait = "0.1"
futures-channel = "0.3"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt"] }
