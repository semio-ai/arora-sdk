[package]
name = "arora-msgs-ros2"
version = "2.4.0"
edition = "2021"
license = "Apache-2.0"
description = "ROS 2 message types for Arora: the std/geometry/sensor/hri messages as arora types, a runtime type registry, and the CDR codec — shared by arora-bridge-ros2 and arora-hal-ros2."
repository = "https://github.com/semio-ai/arora-sdk"

[lib]
name = "arora_msgs_ros2"

[dependencies]
# `derive`: the generated message structs declare their types with
# `#[derive(AroraType)]`.
arora-types = { path = "../arora-types", version = "3", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde stops at arrays of 32; the covariance fields are `float64[36]`.
serde-big-array = "0.5"
thiserror = "2"

# Only the REP-2016 hash (`hash`, feature `interop`) needs ros2-client, so the
# rest builds without the DDS/Zenoh stack (e.g. for wasm).
ros2-client = { package = "ros2-client-multi-rmw", version = "0.14", default-features = false, optional = true }

[features]
default = []
# The REP-2016 hash. Enable it through `dds` or `zenoh`: ros2-client needs
# exactly one backend.
interop = ["dep:ros2-client", "ros2-client/jazzy"]
dds = ["interop", "ros2-client/dds"]
zenoh = ["interop", "ros2-client/zenoh"]

# The build script generates the message structs from the vendored `.msg` files.
[build-dependencies]
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
yaml_serde = "0.10"
