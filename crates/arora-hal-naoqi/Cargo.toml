[package]
name = "arora-hal-naoqi"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "NAOqi HAL for Arora: drives NAO and Pepper robots through the qi framework (libqi-rs) as Arora devices"

[lib]
name = "arora_hal_naoqi"

# The device runner: connects to a robot's NAOqi and runs it as an Arora device.
[[bin]]
name = "arora-naoqi"
path = "src/bin/arora-naoqi.rs"
required-features = ["runner"]

[features]
# The arora-naoqi binary: pulls the full arora runtime. The library (the HAL
# itself) stays lean without it. It enables `studio` for now; the next major
# stops, and a runner that connects to Semio Studio is then built with
# `--features runner,studio`.
runner = ["dep:arora", "dep:anyhow", "dep:arora-simple-data-store", "dep:clap", "tokio/macros", "tokio/rt-multi-thread", "studio"]
# The Semio Studio connection (arora's `studio-bridge`) for the runner, which
# then takes `--studio` and `--no-studio` and connects a device holding a
# saved Studio credential. It adds nothing to the library.
studio = ["arora?/studio-bridge"]

[dependencies]
anyhow = { version = "1", optional = true }
# The runner's command line; `env` reads the robot from `ROBOT`.
clap = { version = "4", features = ["derive", "env"], optional = true }
arora-behavior = { path = "../arora-behavior", version = "9.1" }
arora-hal = { path = "../arora-hal", version = "4" }
arora-module = { path = "../arora-module", version = "2.1" }
arora-simple-data-store = { path = "../arora-simple-data-store", version = "3.1", optional = true }
arora-types = { path = "../arora-types", version = "3" }
# 13.5: `AroraBuilder::with_studio` and `RunnerArgs::studio`, the run's
# Studio choice.
arora = { path = "../arora", version = "14", optional = true }
async-trait = "0.1"
futures = "0.3"
log = "0.4"
# The Rust implementation of the qi framework (libqi), the NAOqi middleware. The package is
# `libqi-vibe`; the library is used as `qi`.
qi = { package = "libqi-vibe", version = "1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# rt, time, sync: the sensor sampling and queued-write tasks run on the caller's runtime.
tokio = { version = "1", features = ["rt", "time", "sync"] }

[dev-dependencies]
# The device test: the default tree on the Arora runtime, without the Studio connection.
arora = { path = "../arora", version = "14" }
arora-simple-data-store = { path = "../arora-simple-data-store", version = "3.1" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
