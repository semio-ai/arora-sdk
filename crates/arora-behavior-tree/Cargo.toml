[package]
name = "arora-behavior-tree"
version = "10.0.0"
edition = "2021"
description = "The Arora behavior tree: Groot-compatible trees ticking Arora modules."
license = "Apache-2.0"

[lib]
path = "src/behavior_tree.rs"

[[bench]]
name = "edit"
harness = false

[[bench]]
name = "scatter"
harness = false

[[bench]]
name = "text"
harness = false

[dependencies]
arora-buffers = { path = "../arora-buffers", version = "3" }
arora-behavior = { path = "../arora-behavior", version = "10" }
arora-types = { path = "../arora-types", version = "3.9" }
# 3: on arora-behavior 10, whose `Status` it re-exports.
arora-behavior-tree-types = { path = "../arora-behavior-tree-types", version = "3" }
lazy_static = "1"
# The text language's lexer.
logos = "0.16"
quick-xml = "0.40"
regex = "1"
semver = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# 0.9 switches the YAML enum representation from single-key maps to `!Tag`,
# which existing tree/module YAML files don't use. Stay on 0.8.
serde_yaml = "0.9"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
derive_more = "2"

[dev-dependencies]
anyhow = "1"
# Only for tests: exercise a `{var}` cell resolved to a real store Slot. The
# library itself stays storage-agnostic (it depends only on the `Slot` trait).
arora-simple-data-store = { path = "../arora-simple-data-store" }
# Only for tests: the text language over a real module's function index.
arora-dataflow-nodes = { path = "../arora-dataflow-nodes", default-features = false }
