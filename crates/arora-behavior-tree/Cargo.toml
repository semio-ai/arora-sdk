[package]
name = "arora-behavior-tree"
version = "8.4.0"
edition = "2021"
description = "The Arora behavior tree: Groot-compatible trees ticking Arora modules."
license = "MIT"

[lib]
path = "src/behavior_tree.rs"

[dependencies]
arora-buffers = { path = "../arora-buffers", version = "3" }
arora-behavior = { path = "../arora-behavior", version = "9.2" }
arora-types = { path = "../arora-types", version = "3" }
arora-behavior-tree-types = { path = "../arora-behavior-tree-types", version = "2" }
lazy_static = "1"
quick-xml = "0.40"
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
# 0.9 switches the YAML enum representation from single-key maps to `!Tag`,
# which existing tree/module YAML files don't use. Stay on 0.8.
serde_yaml = "0.9"
uuid = { version = "1", features = ["serde", "v4"] }
derive_more = "2"

[dev-dependencies]
anyhow = "1"
# Only for tests: exercise a `{var}` cell resolved to a real store Slot. The
# library itself stays storage-agnostic (it depends only on the `Slot` trait).
arora-simple-data-store = { path = "../arora-simple-data-store" }

# The write-fanout bench counts the instructions its process retires (macOS
# `proc_pid_rusage`), so it isolates the ticks from their setup.
[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2"

# The cost of a tick that writes a module's array output to N store keys, for
# each way a tree can bind the elements to the keys:
# `cargo bench -p arora-behavior-tree --bench write_fanout`.
[[bench]]
name = "write_fanout"
harness = false

[build-dependencies]
anyhow = "1"
arora-behavior-tree-types = { path = "../arora-behavior-tree-types", version = "2" }
arora-registry = { path = "../arora-registry", version = "2" }
arora-module-rust = { path = "../arora-module-authoring/rust", version = "2" }
semver = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
