[package]
name = "arora-registry"
version = "2.1.0"
edition = "2021"
description = "Local type-record registry for Arora: stores, tags and freezes type records."
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# 3.8: `TypeDefinitionFrozen`, and the records a declared module and its
# derived types produce (`AroraModule::type_records`).
arora-types = { path = "../arora-types", version = "3.8" }
async-trait = "0.1"
derive_more = "2"
semver = { version = "1", features = ["serde"] }
serde_yaml = "0.9"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
# A module declared in Rust, whose records `add_declared_module` adds.
arora-module = { path = "../arora-module", version = "2.2" }
