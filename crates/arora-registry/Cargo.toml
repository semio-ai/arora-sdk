[package]
name = "arora-registry"
version = "2.1.1"
edition = "2021"
description = "Local type-record registry for Arora: stores, tags and freezes type records."
license = "Apache-2.0"

[dependencies]
# 3.8: `TypeDefinitionFrozen`, `AroraModule::type_records`.
arora-types = { path = "../arora-types", version = "3.8" }
async-trait = "0.1"
derive_more = "2"
semver = { version = "1", features = ["serde"] }
yaml_serde = "0.10"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
# `add_declared_module` adds a Rust-declared module's records.
arora-module = { path = "../arora-module", version = "2.2" }
