[package]
name = "arora-bridge-ws"
version = "7.3.0"
edition = "2021"
description = "The open local bridge for Arora: a WebSocket server implementing arora-bridge, for editors and apps on trusted local links."
license = "Apache-2.0"
repository = "https://github.com/semio-ai/arora-sdk"

[dependencies]
arora-types = { path = "../arora-types", version = "3.2" }
# 6.1: `arora_bridge::client`.
arora-bridge = { path = "../arora-bridge", version = "6.1" }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "rt", "rt-multi-thread", "macros", "io-util", "time"] }
tokio-tungstenite = "0.30"
tokio-util = "0.7"

[dev-dependencies]
# The interpreter module's ABI and the run handle the wire tests' fake runtime
# answers a spawn with.
arora-behavior = { path = "../arora-behavior", version = "10" }
