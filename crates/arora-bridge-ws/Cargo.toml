[package]
name = "arora-bridge-ws"
version = "6.0.0"
edition = "2021"
description = "The open local bridge for Arora: a WebSocket server implementing arora-bridge, for editors and apps on trusted local links."
license = "MIT"
repository = "https://github.com/semio-ai/arora-sdk"

[dependencies]
arora-types = { path = "../arora-types", version = "3" }
arora-bridge = { path = "../arora-bridge", version = "5" }
# The behavior-tree Status enumeration's well-known id: a method that returns it
# is a task run, which the method plane spawns and halts instead of calling.
arora-behavior-tree-types = { path = "../arora-behavior-tree-types", version = "2" }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "rt", "rt-multi-thread", "macros", "io-util", "time"] }
tokio-tungstenite = "0.24"
tokio-util = "0.7"

[dev-dependencies]
# The crate that DEFINES the interpreter-module ABI the method plane speaks over
# the value plane. A dev-dependency only: the ABI-pin test asserts the ids and
# encodings match, without a runtime engine dependency.
arora-behavior = { path = "../arora-behavior", version = "9" }
