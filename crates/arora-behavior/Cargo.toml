[package]
name = "arora-behavior"
version = "9.5.1"
edition = "2021"
description = "The Behavior abstraction the Arora runtime ticks: a behavior tree, a node graph, or any interpreter, against the shared data store — plus the shared behavior graph model."
license = "Apache-2.0"
readme = "readme.md"

[dependencies]
# 3.8: `Status` states the scope of its record (`Scope`, `ARORA`).
arora-types = { path = "../arora-types", version = "3.8" }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde"] }
semver = "1"
