[package]
name = "arora-behavior"
version = "10.0.0"
edition = "2021"
description = "The Behavior abstraction the Arora runtime ticks: a behavior tree, a node graph, or any interpreter, against the shared data store — plus the shared behavior graph model."
license = "Apache-2.0"
readme = "readme.md"

[dependencies]
# 3.8: `Scope`, `ARORA`.
arora-types = { path = "../arora-types", version = "3.8" }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde"] }
semver = "1"
# A graph's sources serialize as single-entry maps, the form YAML writes an
# enum nested in an enum in (`yaml_serde::with::singleton_map_recursive`).
yaml_serde = "0.10"

[dev-dependencies]
serde_json = "1"
