[package]
name = "arora-bridge-ros2"
version = "3.4.0"
edition = "2021"
license = "MIT"
description = "ROS 2 bridge for Arora: exposes a device's keys over ROS 2 topics and accepts commands, as an arora_bridge::Bridge."
repository = "https://github.com/semio-ai/arora-sdk"

[lib]
name = "arora_bridge_ros2"

[dependencies]
arora-types = { path = "../arora-types", version = "2" }
arora-bridge = { path = "../arora-bridge", version = "4" }
# The behavior-tree Status enumeration's well-known ids: the action plane
# discovers action-shaped methods by their Status return type and maps the
# status-key values a run writes onto the ROS goal statuses.
arora-behavior-tree-types = { path = "../arora-behavior-tree-types", version = "1" }
# The ROS 2 message types + the shared CDR codec (re-exported as this crate's
# `cdr`). Core only here — the REP-2016 hash (its `interop` feature) is pulled in
# where the bridge creates hash-keyed publishers.
arora-msgs-ros2 = { path = "../arora-msgs-ros2", version = "0.1" }
async-trait = "0.1"
futures = "0.3"
log = "0.4"
# The semio-ai ros2-client fork, published as `ros2-client-multi-rmw` (upstream
# owns `ros2-client` on crates.io); the library is still imported as `ros2_client`.
# It carries both the DDS backend and a ROS 2-over-Zenoh backend (rmw_zenoh
# compatible), chosen by this crate's `dds` / `zenoh` features (see [features]);
# `jazzy` selects the ROS 2 distro wire format and is always on.
ros2-client = { package = "ros2-client-multi-rmw", version = "0.12", default-features = false, features = ["jazzy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tokio-util = "0.7"

[features]
# Middleware backend selection, forwarded to ros2-client (which requires exactly
# one of `dds`/`zenoh`). DDS is the default; `zenoh` is rmw_zenoh-compatible.
# Build the Zenoh backend with `--no-default-features --features zenoh`.
# Consumers expose these as `ros2-dds` / `ros2-zenoh` with `ros2` = `ros2-dds`.
default = ["dds"]
dds = ["ros2-client/dds"]
zenoh = ["ros2-client/zenoh"]

[dev-dependencies]
# The crate that DEFINES the interpreter-module SPAWN ABI the action plane
# speaks over the value plane. A dev-dependency only: the ABI-pin test asserts
# the bridge's ids and encodings match, without a runtime engine dependency.
arora-behavior = { path = "../arora-behavior", version = "8" }
rand = "0.9"
env_logger = "0.11"
# Serialize the live-DDS tests: running concurrently, their DDS participants pile
# discovery traffic onto the writers (WouldBlock), slowing discovery. `#[serial]`
# runs them one at a time.
serial_test = "3"
tokio = { version = "1", features = ["full"] }
