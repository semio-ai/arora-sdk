[package]
name = "arora-bridge-ros2"
version = "11.3.0"
edition = "2021"
license = "Apache-2.0"
description = "ROS 2 bridge for Arora: exposes a device's keys over ROS 2 topics and accepts commands, as an arora_bridge::Bridge."
repository = "https://github.com/semio-ai/arora-sdk"

[lib]
name = "arora_bridge_ros2"

[dependencies]
arora-types = { path = "../arora-types", version = "3" }
arora-bridge = { path = "../arora-bridge", version = "6" }
# The behavior `Status` ids: the action plane finds action-shaped methods by
# their `Status` return and maps a run's statuses onto ROS goal statuses.
arora-behavior-tree-types = { path = "../arora-behavior-tree-types", version = "3" }
# The ROS 2 message types and the CDR codec (re-exported as `cdr`); its backend
# is selected through [features]. 2.4: on ros2-client 0.14, as this crate is.
arora-msgs-ros2 = { path = "../arora-msgs-ros2", version = "2.4" }
async-trait = "0.1"
futures = "0.3"
log = "0.4"
# The semio-ai fork of ros2-client, with DDS and rmw_zenoh-compatible backends
# (see [features]); `jazzy` is the ROS 2 distro's wire format.
ros2-client = { package = "ros2-client-multi-rmw", version = "0.14", default-features = false, features = ["jazzy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tokio-util = "0.7"

[features]
# The middleware backend: exactly one of `dds` and `zenoh`. Each also enables
# arora-msgs-ros2's REP-2016 hash, which a publisher keys on for native
# rmw_zenoh subscribers to match. Zenoh: `--no-default-features --features zenoh`.
default = ["dds"]
dds = ["ros2-client/dds", "arora-msgs-ros2/dds"]
zenoh = ["ros2-client/zenoh", "arora-msgs-ros2/zenoh"]

[dev-dependencies]
# A device behind the bridge (tests/device.rs), without the wasm engine
# (`native` off).
arora = { path = "../arora", version = "17", default-features = false }
arora-hal = { path = "../arora-hal", version = "4.3" }
arora-simple-data-store = { path = "../arora-simple-data-store", version = "3.1" }
# The interpreter-module spawn ABI, which a test pins the bridge's ids and
# encodings to.
arora-behavior = { path = "../arora-behavior", version = "10" }
rand = "0.10"
env_logger = "0.11"
# The live-DDS tests run one at a time: concurrent participants flood discovery.
serial_test = "4"
tokio = { version = "1", features = ["full"] }
