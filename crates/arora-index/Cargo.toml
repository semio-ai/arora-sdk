[package]
name = "arora-index"
version = "0.1.0"
edition = "2021"
license = "MIT"
readme = "readme.md"
description = "Select, fetch and cache verified assets from registry sources"
publish = false

[features]
default = ["client"]
client = ["dep:async-trait", "dep:crypto_secretbox", "dep:tempfile", "dep:tokio"]
build = ["client", "dep:toml"]

[dependencies]
async-trait = { version = "0.1", optional = true }
crypto_secretbox = { version = "0.1", optional = true }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tempfile = { version = "3", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["rt", "time"], optional = true }
toml = { version = "0.9", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[[test]]
name = "resolver"
required-features = ["client"]

[[test]]
name = "build"
required-features = ["build"]
