[package]
name = "arora-module-core"
version = "4.0.0"
edition = "2021"
description = "Module analysis and resolution for Arora module authoring."
license = "Apache-2.0"

[dependencies]
arora-registry = { path = "../../arora-registry", version = "2" }
arora-types = { path = "../../arora-types", version = "3" }
arora-vfs = { path = "../../arora-vfs", version = "0.1" }
bytes = "1"
derive_more = { version = "2", features = ["display"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
tokio = { version = "1", features = ["rt", "macros", "io-util"] }
uuid = "1"

[dev-dependencies]
yaml_serde = "0.10"
uuid = { version = "1", features = ["serde", "v4"] }
