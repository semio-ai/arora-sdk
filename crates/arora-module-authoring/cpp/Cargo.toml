[package]
name = "arora-module-cpp"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"

[dependencies]
arora-module-core = { path = "../core" }
arora-registry = { path = "../../arora-registry" }
arora-types = { path = "../../arora-types", version = "3" }
arora-vfs = { path = "../../arora-vfs" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
convert_case = "0.12"
derive_more = { version = "2", features = ["from"] }
lazy_static = "*"
semver = "1"
serde = { version = "1", features = ["derive"] }
yaml_serde = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["serde", "v4"] }
