[package]
name = "arora-animation"
version = "1.0.0"
edition = "2021"
description = "Keyframe animation for Arora: the animation format, exact evaluation with velocities, and players that run unattended on a device clock."
license = "Apache-2.0"
repository = "https://github.com/semio-ai/arora-sdk"
readme = "readme.md"
keywords = ["arora", "animation", "keyframe", "robotics"]
categories = ["science::robotics", "wasm"]
# The tests' reference results; not needed to build.
exclude = ["fixtures/"]

[dependencies]
# A stored animation's JSON form.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
