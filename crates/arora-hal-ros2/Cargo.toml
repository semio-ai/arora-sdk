[package]
name = "arora-hal-ros2"
version = "2.0.1"
edition = "2021"
license = "MIT"
description = "ROS 2 HAL for Arora: drives ROS robots (NAO, Pepper, Quori, UR3/UR5, G1) as Arora devices"

[lib]
name = "arora_hal_ros2"

# The device runner: one binary, the robot is picked at runtime (CLI arg or
# ROBOT env var — a well-known name or a JSON config path).
[[bin]]
name = "arora-ros2"
path = "src/bin/arora-ros2.rs"
required-features = ["runner"]

[features]
# Middleware backend selection, forwarded to ros2-client (which requires exactly
# one of `dds`/`zenoh`) and to arora-msgs-ros2 (whose REP-2016 type-hash needs the
# same backend). DDS is the default; build the Zenoh backend with
# `--no-default-features --features zenoh`.
default = ["dds"]
dds = ["ros2-client/dds", "arora-msgs-ros2/dds"]
zenoh = ["ros2-client/zenoh", "arora-msgs-ros2/zenoh"]
# The arora-ros2 binary: pulls the full arora runtime with the Semio Studio
# connection. The library (the HAL itself) stays lean without it.
runner = ["dep:arora", "dep:anyhow"]

[dependencies]
anyhow = { version = "1", optional = true }
arora-hal = { path = "../arora-hal", version = "3" }
arora-types = { path = "../arora-types", version = "2" }
# The bundled ROS 2 message types (typed serde structs + REP-2016 identity),
# shared with `arora-bridge-ros2`; its `dds`/`zenoh` features supply the type-hash
# a Zenoh publisher keys on. Core only here — a backend is selected via [features].
arora-msgs-ros2 = { path = "../arora-msgs-ros2", version = "0.1", default-features = false }
arora = { path = "../arora", version = "9", features = ["studio-bridge"], optional = true }
async-trait = "0.1"
byteorder = "1"
chrono = "0.4"
futures = "0.3"
log = "0.4"
# The semio-ai ros2-client fork, published as `ros2-client-multi-rmw` (upstream
# owns `ros2-client` on crates.io); the library is still imported as `ros2_client`.
# It carries both the DDS backend and a ROS 2-over-Zenoh backend (rmw_zenoh
# compatible), chosen by this crate's `dds` / `zenoh` features; `jazzy` selects
# the ROS 2 distro wire format and is always on.
ros2-client = { package = "ros2-client-multi-rmw", version = "0.12", default-features = false, features = ["jazzy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }

[dev-dependencies]
rand = "0.9"
# `time` (tests only): the DDS round-trip tests sleep and time out around
# discovery; the HAL itself needs no timers.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

# build.rs downloads the robots' GLB models (public Semio Studio assets) into
# models/. TLS is pinned to the bundled webpki roots so it also works on hosts
# with no populated OS trust store.
[build-dependencies]
bytes = "1"
reqwest = { version = "0.13", features = [
  "rustls-no-provider",
], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
webpki-roots = "1"
tokio = { version = "1", features = ["macros", "rt"] }
