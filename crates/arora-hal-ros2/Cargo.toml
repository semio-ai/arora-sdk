[package]
name = "arora-hal-ros2"
version = "6.1.0"
edition = "2021"
license = "Apache-2.0"
description = "ROS 2 HAL for Arora: drives ROS robots (NAO, Pepper, Quori, UR3/UR5, G1) as Arora devices"

[lib]
name = "arora_hal_ros2"

# The device runner; the robot (a known name or a JSON config) is picked at run
# time.
[[bin]]
name = "arora-ros2"
path = "src/bin/arora-ros2.rs"
required-features = ["runner"]

[features]
# The middleware backend: exactly one of `dds` and `zenoh`, forwarded to
# ros2-client and arora-msgs-ros2. Zenoh: `--no-default-features --features zenoh`.
default = ["dds"]
dds = ["ros2-client/dds", "arora-msgs-ros2/dds"]
zenoh = ["ros2-client/zenoh", "arora-msgs-ros2/zenoh"]
# The arora-ros2 binary, over the full arora runtime.
runner = ["dep:arora", "dep:anyhow", "dep:clap"]
# The runner's Semio Studio connection (arora's `studio-bridge`).
studio = ["arora?/studio-bridge"]

[dependencies]
anyhow = { version = "1", optional = true }
# `env`: the runner reads the robot from `ROBOT`.
clap = { version = "4", features = ["derive", "env"], optional = true }
# 4.3: `Hal::describe_keys`.
arora-hal = { path = "../arora-hal", version = "4.3" }
arora-types = { path = "../arora-types", version = "3.1" }
# The ROS 2 message types; its backend is selected through [features].
arora-msgs-ros2 = { path = "../arora-msgs-ros2", version = "2", default-features = false }
# 17: `studio::of`, `StudioArgs::connects`, `AroraBuilder::with_studio_handle`,
# `RunnerArgs::device`.
arora = { path = "../arora", version = "17", optional = true }
async-trait = "0.1"
byteorder = "1"
chrono = "0.4"
futures = "0.3"
log = "0.4"
# The semio-ai fork of ros2-client, with DDS and rmw_zenoh-compatible backends
# (see [features]); `jazzy` is the ROS 2 distro's wire format.
ros2-client = { package = "ros2-client-multi-rmw", version = "0.14", default-features = false, features = ["jazzy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }

[dev-dependencies]
# A device over the HAL, for the tests of what it opens to remote writers.
arora = { path = "../arora", version = "17" }
rand = "0.10"
# `time`: the DDS round-trip tests time out around discovery.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
