[package]
name = "arora-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
arora-engine = { path = "../arora-engine" }
arora-buffers = { path = "../arora-buffers" }
arora-types = { path = "../arora-types", version = "3" }
arora-module-core = { path = "../arora-module-authoring/core" }
arora-registry = { path = "../arora-registry" }
arora-registry-remote = { path = "../arora-registry-remote" }
semio-client = { git = "https://github.com/semio-ai/semio-client.git", branch = "main" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
yaml_serde = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
