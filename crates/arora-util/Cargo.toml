[package]
name = "arora-util"
version = "0.1.1"
edition = "2021"
description = "Internal utility helpers for the Arora runtime."
license = "Apache-2.0"
# No native library: the key hands dependents' build scripts the generated C
# header's directory, as DEP_ARORA_UTIL_INCLUDE.
links = "arora_util"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
uuid = { version = "1", features = ["serde"] }

[build-dependencies]
cbindgen = "0.29"
