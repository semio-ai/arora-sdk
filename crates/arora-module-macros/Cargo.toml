[package]
name = "arora-module-macros"
version = "3.1.1"
edition = "2021"
description = "Declare an Arora module on a Rust module: #[module], #[export], #[param], declare_module!, #[contract], module_from_header!."
license = "Apache-2.0"
repository = "https://github.com/semio-ai/arora-sdk"
readme = "readme.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "extra-traits"] }
# Read at expansion time: `#[arora(id)]` literals, and the header
# `module_from_header!` reads.
uuid = "1"
arora-types = { path = "../arora-types", version = "3", default-features = false }
yaml_serde = "0.10"
