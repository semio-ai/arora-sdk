[package]
name = "arora-buffers"
version = "3.3.1"
edition = "2021"
description = "Binary read/write buffers and type tags for the Arora module value ABI."
license = "Apache-2.0"
# No native library: the key hands dependents' build scripts the generated C
# header's directory, as DEP_ARORA_BUFFERS_INCLUDE.
links = "arora_buffers"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
arora-types = { path = "../arora-types", version = "3" }
bytes = "1"
uuid = { version = "1", features = ["serde", "v4"] }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
anyhow = "1"
yaml_serde = "0.10"
