[package]
name = "arora-web"
version = "14.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/semio-ai/arora-sdk"
description = "Run an Arora device in the browser: the AroraRuntime wasm-bindgen device over the arora runtime, plus engine and module tooling."

[lib]
crate-type = ["cdylib", "rlib"]

# The crate is wasm32-only; on the host it is empty, so a native build or
# `cargo package` links no browser host.
[target.'cfg(target_arch = "wasm32")'.dependencies]
arora-engine = { path = "../arora-engine", version = "7", default-features = false }
arora-types = { path = "../arora-types", version = "3" }
# Without default features: the browser engine host and a Tokio-free runtime.
# 17: the `Arora`/`AroraBuilder` this crate's API carries.
arora = { path = "../arora", version = "17", default-features = false }
# 2.1: the records layout `withRecords` loads.
arora-registry = { path = "../arora-registry", version = "2.1" }
# 6.1: `arora_bridge::client`. 6.3: on arora-behavior 10.
arora-bridge = { path = "../arora-bridge", version = "6.3" }
# The run handle's encoding, which `client::run_value` reads.
arora-behavior = { path = "../arora-behavior", version = "10" }
wasm-bindgen = "0.2"
futures = "0.3"
# Sync primitives only: the device's behavior-error watch.
tokio = { version = "1", default-features = false, features = ["sync"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
# The fake HAL, whose sibling handle shows what a step wrote it.
arora-hal = { path = "../arora-hal", version = "4.3" }
# The store a test makes fail, over the simple store.
arora-simple-data-store = { path = "../arora-simple-data-store", version = "3.2" }
yaml_serde = "0.10"
# The guest the browser test loads (CARGO_CDYLIB_FILE_TEST_RUST_WASM_test_rust_wasm);
# `lib = true` also gives the test its declaration, the header it loads with.
test-rust-wasm = { path = "../../modules/test-rust-wasm", artifact = "cdylib", target = "wasm32-wasip2", lib = true }
