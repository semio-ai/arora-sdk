[package]
name = "arora-hal-restful"
version = "5.1.0"
edition = "2021"
license = "Apache-2.0"
description = "RESTful-API HAL for Arora: drives HTTP-controlled robots (hackerbot) as Arora devices"

[lib]
name = "arora_hal_restful"

# The device runner; the robot's HTTP API comes from a JSON config picked at run
# time.
[[bin]]
name = "arora-restful"
path = "src/bin/arora-restful.rs"
required-features = ["runner"]

[features]
# The arora-restful binary, over the full arora runtime.
runner = ["dep:arora", "dep:anyhow", "dep:clap"]
# The runner's Semio Studio connection (arora's `studio-bridge`).
studio = ["arora?/studio-bridge"]

[dependencies]
anyhow = { version = "1", optional = true }
# `env`: the runner reads the configuration file from `CONFIG`.
clap = { version = "4", features = ["derive", "env"], optional = true }
arora-hal = { path = "../arora-hal", version = "4.3" }
arora-types = { path = "../arora-types", version = "3.1" }
# 17: the current major. 16: `AroraBuilder::with_studio`, `studio::StudioArgs`,
# `RunnerArgs::device`.
arora = { path = "../arora", version = "17", optional = true }
async-trait = "0.1"
futures = "0.3"
log = "0.4"
# TLS trusts the bundled webpki roots, for hosts without an OS trust store.
reqwest = { version = "0.13", features = [
  "json",
  "rustls-no-provider",
], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `rt`: the queued-write task behind `try_send` runs on the caller's runtime.
tokio = { version = "1", features = ["rt"] }
webpki-roots = "1"

[dev-dependencies]
# A device over the HAL, for the tests of what it opens to remote writers.
arora = { path = "../arora", version = "17" }
# `time`: the try_send test times out around the queued write.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
