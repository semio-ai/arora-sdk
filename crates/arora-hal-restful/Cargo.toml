[package]
name = "arora-hal-restful"
version = "4.4.0"
edition = "2021"
license = "Apache-2.0"
description = "RESTful-API HAL for Arora: drives HTTP-controlled robots (hackerbot) as Arora devices"

[lib]
name = "arora_hal_restful"

# The device runner: the robot's HTTP API topology comes entirely from a JSON
# config picked at runtime (CLI arg or CONFIG env var).
[[bin]]
name = "arora-restful"
path = "src/bin/arora-restful.rs"
required-features = ["runner"]

[features]
# The arora-restful binary: pulls the full arora runtime. The library (the HAL
# itself) stays lean without it. It enables `studio` for now; the next major
# stops, and a runner that connects to Semio Studio is then built with
# `--features runner,studio`.
runner = ["dep:arora", "dep:anyhow", "dep:clap", "studio"]
# The Semio Studio connection (arora's `studio-bridge`) for the runner, which
# then takes `--studio` and `--no-studio` and connects a device holding a
# saved Studio credential. It adds nothing to the library.
studio = ["arora?/studio-bridge"]

[dependencies]
anyhow = { version = "1", optional = true }
# The runner's command line; `env` reads the configuration file from `CONFIG`.
clap = { version = "4", features = ["derive", "env"], optional = true }
arora-hal = { path = "../arora-hal", version = "4.3" }
arora-types = { path = "../arora-types", version = "3.1" }
# 13.5: `AroraBuilder::with_studio` and `RunnerArgs::studio`, the run's
# Studio choice.
arora = { path = "../arora", version = "14", optional = true }
async-trait = "0.1"
futures = "0.3"
log = "0.4"
# TLS is pinned to the bundled webpki roots (see `tls`) so HTTPS robots also
# work on hosts with no populated OS trust store.
reqwest = { version = "0.13", features = [
  "json",
  "rustls-no-provider",
], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# rt only: the queued-write task serving `try_send` runs on the caller's runtime.
tokio = { version = "1", features = ["rt"] }
webpki-roots = "1"

[dev-dependencies]
# A device over the HAL, for the tests of what it opens to remote writers.
arora = { path = "../arora", version = "14" }
# `time` (tests only): the try_send test times out around the queued write.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
