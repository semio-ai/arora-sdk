[package]
name = "arora-behavior-tree-types"
version = "2.2.0"
edition = "2021"
description = "Type records the Arora behavior tree declares (Status, TickId, folder)."
license = "Apache-2.0"

[dependencies]
# 3.8: `TickId` states the scope of its record (`ARORA`).
arora-types = { path = "../arora-types", version = "3.8" }
# `Status`, which this crate re-exports. 9.5: its record, in the `arora` scope.
arora-behavior = { path = "../arora-behavior", version = "9.5" }
lazy_static = "1"
semver = "1"
uuid = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
yaml_serde = "0.10"
