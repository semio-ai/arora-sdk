[package]
name = "arora-geometry"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Arora's geometry types over its Value: 2-, 3- and 4-component vectors, quaternions and transforms, with blending."
repository = "https://github.com/semio-ai/arora-sdk"
readme = "README.md"
keywords = ["arora", "geometry", "quaternion", "robotics"]
categories = ["science::robotics", "mathematics"]

[dependencies]
arora-types = { path = "../arora-types", version = "3" }
uuid = "1"

[dev-dependencies]
serde_json = "1"
