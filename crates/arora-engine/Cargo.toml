[package]
name = "arora-engine"
version = "5.5.0"
authors = ["Braden McDorman <bmcdorman@gmail.com>"]
edition = "2021"
description = "The Arora engine: loads and executes Arora modules (wasm and native hosts)."
license = "Apache-2.0"

[lib]
crate-type = ["rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["wasmtime-host", "native-host"]
# Native host using wasmtime to instantiate guest modules.
wasmtime-host = ["dep:wasmtime", "dep:wasmtime-wasi"]
# Native host using libloading to load .so/.dylib modules.
native-host = ["dep:libloading", "dep:tempfile"]

[dependencies]
anyhow = "1"
arora-buffers = { path = "../arora-buffers", version = "3" }
arora-types = { path = "../arora-types", version = "3" }
async-trait = "0.1"
bytes = "1"
derive_more = { version = "2", features = ["display", "error", "from"] }
lazy_static = "1"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
# Reads a component's layer (`component_layout`), which the browser checks
# before it runs the guest module: the parser alone, without the validator,
# which would ship ~0.9 MB more to the browser. 0.261 is wasmtime 50's.
wasmparser = { version = "0.261", default-features = false, features = ["std", "component-model"] }

# Native-only optional deps. Disabled when targeting wasm32 (browser host).
libloading = { version = "0.9", optional = true }
tempfile = { version = "3", optional = true }
wasmtime = { version = "50", features = ["async"], optional = true }
wasmtime-wasi = { version = "50", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["console"] }
# Browser RNG backend for `rand`. `wasm_js` (plus the getrandom_backend cfg in
# .cargo/config.toml) lets getrandom build for wasm32-unknown-unknown.
getrandom = { version = "0.4", features = ["wasm_js"] }

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
uuid = { version = "1", features = ["serde", "v4"] }
# The text-format assembler for the hand-written guests and components.
wat = "1"

# Browser-host integration test (tests/browser.rs), wasm32-only. serde_yaml +
# uuid above supply the header/value types; these add the test harness, the
# panic hook, and the guest modules the tests load through the browser
# executors.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
arora-types = { path = "../arora-types", version = "3" }
wasm-bindgen-test = "0.3"
console_error_panic_hook = "0.1"
# test-rust-wasm guest (wasm32-wasip1) that the browser test include_bytes!s;
# cargo exposes its path as CARGO_CDYLIB_FILE_TEST_RUST_WASM_test_rust_wasm.
# `lib = true` also brings the crate in for the test's own target: the header
# the test loads comes from the module's Rust declaration.
test-rust-wasm = { path = "../../modules/test-rust-wasm", artifact = "cdylib", target = "wasm32-wasip1", lib = true }
# The component guest tests/browser_component.rs include_bytes!s; cargo exposes
# its path as CARGO_CDYLIB_FILE_TEST_RUST_COMPONENT_test_rust_component.
test-rust-component = { path = "../../modules/test-rust-component", artifact = "cdylib", target = "wasm32-wasip2" }

# Native-host integration test (tests/native.rs): the same guest built for the
# host as a cdylib, loaded through NativeExecutor; cargo exposes its path as
# CARGO_CDYLIB_FILE_TEST_RUST_WASM_test_rust_wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
test-rust-wasm = { path = "../../modules/test-rust-wasm", artifact = "cdylib", lib = true }
