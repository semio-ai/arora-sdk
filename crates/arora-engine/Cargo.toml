[package]
name = "arora-engine"
version = "7.1.0"
authors = ["Braden McDorman <bmcdorman@gmail.com>"]
edition = "2021"
description = "The Arora engine: loads and executes Arora modules (wasm and native hosts)."
license = "Apache-2.0"

[lib]
crate-type = ["rlib"]

[features]
default = ["wasmtime-host", "native-host"]
# The native host running wasm guests.
wasmtime-host = ["dep:wasmtime", "dep:wasmtime-wasi"]
# The native host loading dynamic-library modules.
native-host = ["dep:libloading", "dep:tempfile"]

[dependencies]
anyhow = "1"
arora-buffers = { path = "../arora-buffers", version = "3.2" }
arora-types = { path = "../arora-types", version = "3" }
async-trait = "0.1"
bytes = "1"
derive_more = { version = "2", features = ["display", "error", "from"] }
lazy_static = "1"
log = "0.4"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
# `component_layout`: the parser without the validator, which would add ~0.9 MB
# to the browser build. 0.261 is wasmtime 50's, so native builds hold one copy.
wasmparser = { version = "0.261", default-features = false, features = ["std", "component-model"] }

libloading = { version = "0.9", optional = true }
tempfile = { version = "3", optional = true }
wasmtime = { version = "50", features = ["async"], optional = true }
wasmtime-wasi = { version = "50", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["console"] }
# `rand` in the browser: `wasm_js`, with the getrandom_backend cfg in
# .cargo/config.toml.
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
yaml_serde = "0.10"
uuid = { version = "1", features = ["serde", "v4"] }
# The text-format assembler for the hand-written guests and components.
wat = "1"

# The browser-host test (tests/browser_component.rs).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
arora-types = { path = "../arora-types", version = "3" }
wasm-bindgen-test = "0.3"
console_error_panic_hook = "0.1"
# The guest it loads (CARGO_CDYLIB_FILE_TEST_RUST_COMPONENT_test_rust_component).
test-rust-component = { path = "../../modules/test-rust-component", artifact = "cdylib", target = "wasm32-wasip2" }

# The native-host test (tests/native.rs) loads this guest built for the host
# (CARGO_CDYLIB_FILE_TEST_RUST_WASM_test_rust_wasm).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
test-rust-wasm = { path = "../../modules/test-rust-wasm", artifact = "cdylib", lib = true }
