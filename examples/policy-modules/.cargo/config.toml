# Artifact dependencies: the device crate depends on the policy module built
# for wasm32-wasip1 and embeds the resulting `.wasm` (see crates/device).
[unstable]
bindeps = true

# MuJoCo is a shared library the `mujoco-rs` build script links against; point
# `MUJOCO_DYNAMIC_LINK_DIR` at the directory holding `libmujoco.dylib` /
# `libmujoco.so` (tools/setup-mujoco.sh downloads the pinned release there).
# The variable is read from the environment, not from here, so that the same
# checkout builds on a machine where MuJoCo lives elsewhere.
