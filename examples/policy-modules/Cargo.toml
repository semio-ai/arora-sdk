# Control policies as Arora modules — a self-contained workspace.
#
# It is deliberately not a member of the arora-sdk workspace: it pulls a
# physics engine (MuJoCo) and an ONNX runtime that the SDK itself has no use
# for, and it is meant to be forked into its own repository. The arora crates
# are reached by path while it lives here; each path dependency also names the
# published version, so moving it out is deleting the `path` keys.
[workspace]
resolver = "2"
members = [
  "crates/arora-policy",
  "crates/arora-hal-mujoco",
  "modules/microduck-policies",
  "modules/blackboard",
  "crates/device",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Semio"]

[workspace.dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde", "v4"] }

# The arora crates this workspace builds on.
arora = { path = "../../crates/arora", version = "10.1" }
arora-behavior = { path = "../../crates/arora-behavior", version = "9" }
arora-behavior-tree = { path = "../../crates/arora-behavior-tree", version = "8.1" }
arora-bridge = { path = "../../crates/arora-bridge", version = "5" }
arora-hal = { path = "../../crates/arora-hal", version = "4" }
arora-module = { path = "../../crates/arora-module", version = "2" }
arora-simple-data-store = { path = "../../crates/arora-simple-data-store", version = "3" }
arora-types = { path = "../../crates/arora-types", version = "3" }
arora-engine = { path = "../../crates/arora-engine", version = "5" }

# Crates published outside this checkout — the Studio client behind the
# `studio` feature — depend on these two from crates.io; patched to the same
# path copies, their `Bridge` and `Value` are the ones the runtime uses.
# Removed with the `path` keys when the workspace leaves the SDK checkout.
[patch.crates-io]
arora-bridge = { path = "../../crates/arora-bridge" }
arora-types = { path = "../../crates/arora-types" }

# The policy module is built twice: natively (its tests, the in-process
# device) and as a wasm guest through the device's artifact dependency, which
# follows the device's own profile. The guest is what ships, so both profiles
# optimize it and keep debug info out of it (debug info is most of a wasm
# file's size).
[profile.release]
debug = false
strip = true
lto = "thin"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2
# Dependencies' debug info is most of a dev wasm guest's size (the ONNX
# runtime alone puts it over a hundred megabytes); the workspace's own crates
# keep theirs.
debug = false

[profile.dev.package.microduck-policies]
opt-level = 3
debug = false

[profile.dev.package.arora-policy]
opt-level = 3
debug = false
