# Control policies as Arora modules. Not an arora-sdk workspace member: it pulls
# MuJoCo and an ONNX runtime the SDK has no use for, and is meant to be forked.
[workspace]
resolver = "2"
members = [
  "crates/arora-policy",
  "crates/arora-hal-mujoco",
  "modules/microduck-policies",
  "modules/say-piper",
  "crates/arora-microduck",
]
# say-piper builds libpiper with cmake and links GPLv3 code: built only on
# request (`-p say-piper`, or the device's `piper` feature).
default-members = [
  "crates/arora-policy",
  "crates/arora-hal-mujoco",
  "modules/microduck-policies",
  "crates/arora-microduck",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Semio"]

[workspace.dependencies]
anyhow = "1"
log = "0.4"

# `path` while the workspace lives in the SDK checkout, `version` for crates.io:
# moving it out is deleting the `path` keys.
arora = { path = "../../crates/arora", version = "16" }
arora-behavior = { path = "../../crates/arora-behavior", version = "9.6" }
arora-hal = { path = "../../crates/arora-hal", version = "4.3" }
arora-module = { path = "../../crates/arora-module", version = "2.3" }
arora-simple-data-store = { path = "../../crates/arora-simple-data-store", version = "3.2" }
arora-types = { path = "../../crates/arora-types", version = "3.10" }

# The Studio client (`studio` feature) depends on these from crates.io; the patch
# makes its `Bridge` and `Value` the runtime's. Goes with the `path` keys.
[patch.crates-io]
arora-bridge = { path = "../../crates/arora-bridge" }
arora-types = { path = "../../crates/arora-types" }

# The policy module's wasm guest follows the device's profile, so both profiles
# optimize it and keep debug info, most of a wasm file's size, out of it.
[profile.release]
debug = false
strip = true
lto = "thin"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2
# The ONNX runtime's debug info alone puts a dev guest over 100 MB.
debug = false

[profile.dev.package.microduck-policies]
opt-level = 3
debug = false

[profile.dev.package.arora-policy]
opt-level = 3
debug = false
