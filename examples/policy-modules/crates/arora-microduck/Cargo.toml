[package]
name = "arora-microduck"
description = "Microduck in MuJoCo, driven by Arora: the policy module (wasm or in-process), a behavior tree, and the local bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "arora-microduck"
path = "src/main.rs"

[features]
# Serve through Semio Studio instead of the open local bridge, unless the run
# passes --no-studio.
studio = ["arora/studio-bridge"]
# Speak on board with Piper. Opt-in: libpiper and espeak-ng are GPLv3.
piper = ["dep:say-piper"]

[dependencies]
anyhow.workspace = true
arora.workspace = true
arora-hal.workspace = true
arora-hal-mujoco = { path = "../arora-hal-mujoco", version = "0.1" }
arora-policy = { path = "../arora-policy", version = "0.1" }
arora-simple-data-store.workspace = true
arora-types.workspace = true
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log.workspace = true
serde_json = "1"
# Both the library (declaration, in-process functions) and the wasm32-wasip2
# guest the device loads.
microduck-policies = { path = "../../modules/microduck-policies", artifact = "cdylib", target = "wasm32-wasip2", lib = true }
say-piper = { path = "../../modules/say-piper", version = "0.1", optional = true }
say-silent = { path = "../../../../modules/say-silent", version = "0.1" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
