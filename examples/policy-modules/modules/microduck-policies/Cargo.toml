[package]
name = "microduck-policies"
description = "Microduck's learned locomotion policies as Arora behavior leaves: walk, stand, sit, rise, skills, and a head animation over the balancing policy"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# `cdylib`: the wasm guest. `rlib`: the in-process module and the declaration
# its loaders use.
crate-type = ["cdylib", "rlib"]

[dependencies]
arora-behavior.workspace = true
arora-module.workspace = true
arora-policy = { path = "../../crates/arora-policy", version = "0.1" }
