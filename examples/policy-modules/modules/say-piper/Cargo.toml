[package]
name = "say-piper"
description = "The say leaf spoken on board by Piper: synthesis and playback advanced a step per tick"
version.workspace = true
edition.workspace = true
authors.workspace = true
# libpiper and espeak-ng are GPLv3.
license = "GPL-3.0-or-later"
# Publishes DEP_PIPER_INSTALL_DIR, which the device's build script puts on its
# binaries' rpath.
links = "piper"

[dependencies]
arora-behavior.workspace = true
arora-module.workspace = true
log.workspace = true
rodio = { version = "0.23", default-features = false, features = ["playback"] }

[build-dependencies]
bindgen = "0.73"
