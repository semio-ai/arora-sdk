[package]
name = "say"
description = "Speech as a behavior leaf: say(text, voice) -> Status on Vizij's say contract, spoken through Vizij's TTS cloud provider or silently"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
arora-behavior.workspace = true
arora-module.workspace = true
log.workspace = true
# Synthesis: the Vizij TTS cloud function over HTTPS.
reqwest = { version = "0.13", features = ["json"] }
# Pure-Rust playback (cpal + symphonia): nothing to install.
rodio = "0.20"
serde = { workspace = true }
# Synthesis and playback run off the tick: a tokio task fetches, a
# blocking-pool task plays.
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
