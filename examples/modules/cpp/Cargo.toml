[package]
name = "example-cpp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Example C++ module — a wasm guest built through cargo, cmake and the WASI SDK into a module directory"
publish = false
build = "build.rs"

# The cargo-side entry point for a C++ wasm guest: the Rust source is empty,
# and the build script invokes cmake against CMakeLists.txt, which writes the
# module directory a device loads (see readme.md).

[lib]
path = "src/lib.rs"

[build-dependencies]
anyhow = "1"
wasi-sdk = { path = "../../../crates/wasi-sdk" }
cmake = "0.1"
# Host bins for code generation (module.yaml -> C++ bindings and the header).
# arora-module-cli finds the C++ generator beside itself, so the build script
# stages both into one directory.
arora-module-cli = { path = "../../../crates/arora-module-authoring/cli", artifact = "bin" }
arora-module-cpp = { path = "../../../crates/arora-module-authoring/cpp", artifact = "bin" }
# wasm32-wasip1 static libraries the C++ links against.
arora-buffers = { path = "../../../crates/arora-buffers", artifact = "staticlib", target = "wasm32-wasip1" }
arora-util = { path = "../../../crates/arora-util", artifact = "staticlib", target = "wasm32-wasip1" }
