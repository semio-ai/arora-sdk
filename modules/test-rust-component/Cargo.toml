[package]
name = "test-rust-component"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Test module built as a WebAssembly Component (wasm32-wasip2) against the arora:module WIT world"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"
# The error buffer the `error-buffer` function returns.
arora-buffers = { path = "../../crates/arora-buffers" }

# The WASI 0.2 interfaces the `wasi` function calls directly.
[target.'cfg(target_os = "wasi")'.dependencies]
wasip2 = "2"
