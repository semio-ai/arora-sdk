id: a1a6bb9a-334f-4617-a764-9a55817039d8
author: Semio
description: Text-to-speech module — speaks text and streams the current viseme; uses the Vizij TTS provider (AWS Polly behind the demo cloud function)
license: Proprietary
name: polly
version:
  major: 0
  minor: 1
  patch: 0
executor:
  name: native
exports:
  - type: function
    id: e5a41333-4848-411f-878c-f1d662ebb4a0
    name: hello_world
    ret:
      kind: scalar
      id: behavior_tree.Status

  - type: function
    id: e1b4bda7-1c7b-4322-b9a0-552201b8a011
    name: say
    parameters:
      - id: fb3787f2-2151-49ce-8b61-6274984558ea
        name: text
        type:
          kind: scalar
          id: str
      - id: 1f6b2c40-9d3e-4a71-8b52-6e0f9c4a2d10
        name: voice
        type:
          kind: scalar
          id: str
      # Mutable = an out-parameter. Each tick `say` writes the viseme code at the
      # audio playhead here (the AWS Polly viseme set). The module only *produces*
      # the current viseme; mapping it to face poses is the caller's job.
      - id: 2a7c3d51-0e4f-4b82-9c63-7f1a0d5b3e21
        name: viseme
        type:
          kind: scalar
          id: str
        mutable: true
    ret:
      kind: scalar
      id: behavior_tree.Status

imports: []
dependencies: []
executable_mime: application/x-binary
