[package]
name = "polly"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
# The cdylib is the artifact; the rlib gives the tests the declaration.
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "*"
arora-behavior = { path = "../../crates/arora-behavior", version = "10" }
arora-module = { path = "../../crates/arora-module", version = "2" }
aws-config = "1"
aws-sdk-polly = "1"
bytes = "1"
derive_more = "2"
lazy_static = "*"
soloud = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
anyhow = "*"
arora-engine = { path = "../../crates/arora-engine" }
arora-behavior-tree = { path = "../../crates/arora-behavior-tree" }
arora-module-core = { path = "../../crates/arora-module-authoring/core" }
arora-registry = { path = "../../crates/arora-registry" }
arora-types = { path = "../../crates/arora-types", version = "3" }
convert_case = "0.12"
rand = "0.10"
yaml_serde = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
uuid = { version = "1", features = ["serde", "v4"] }
test-behavior-tree-nodes = { path = "../../modules/test-behavior-tree-nodes", artifact = "cdylib", target = "wasm32-wasip2" }
