[package]
name = "test-cpp-2"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "C++ test module 2 — wasm guest that imports test-cpp's types"
build = "build.rs"

[lib]
path = "src/lib.rs"

# For their C headers' directories (DEP_ARORA_*_INCLUDE), which cargo passes
# through a regular dependency only.
[dependencies]
arora-buffers = { path = "../../crates/arora-buffers" }
arora-util = { path = "../../crates/arora-util" }

[build-dependencies]
anyhow = "1"
wasi-sdk = { path = "../../crates/wasi-sdk" }
cmake = "0.1"
arora-module-cli = { path = "../../crates/arora-module-authoring/cli", artifact = "bin" }
arora-module-cpp = { path = "../../crates/arora-module-authoring/cpp", artifact = "bin" }
arora-buffers = { path = "../../crates/arora-buffers", artifact = "staticlib", target = "wasm32-wasip2" }
arora-util = { path = "../../crates/arora-util", artifact = "staticlib", target = "wasm32-wasip2" }
# Orders test-cpp's build script, which writes the records this guest imports,
# before this one.
test-cpp = { path = "../test-cpp" }
