[package]
name = "arora-animation-module"
version = "2.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/semio-ai/arora-sdk"
readme = "readme.md"
description = "Arora animation playback and baking as a host-linked module or WebAssembly guest."

[lib]
# The `cdylib` is the wasm guest the device loads; the `rlib` lets the same
# crate run in-process and carries the declaration (ids, header, signatures)
# to whoever loads the guest.
crate-type = ["cdylib", "rlib"]

[dependencies]
# 2.2: a declaration's scope and the records of the types its functions name.
arora-module = { path = "../../crates/arora-module", version = "2.3" }
# 3.8: the records the derive gives each record type.
arora-types = { path = "../../crates/arora-types", version = "3.8" }
arora-animation = { path = "../../crates/arora-animation", version = "1" }
# `module-dir`: write the module directory a device loads the guest from.
arora-registry = { path = "../../crates/arora-registry", version = "2.1", optional = true }
futures = { version = "0.3", optional = true }
serde_json = { version = "1", optional = true }

[features]
module-dir = ["dep:arora-registry", "dep:futures", "dep:serde_json"]

[dev-dependencies]
arora-engine = { path = "../../crates/arora-engine", version = "7" }
serde_json = "1"

[[example]]
name = "module_dir"
required-features = ["module-dir"]
