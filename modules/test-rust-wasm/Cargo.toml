[package]
name = "test-rust-wasm"
version = "0.1.0"
authors = ["Victor Paleologue <victor.paleologue@palaio.eu>"]
description = "A test module project compiled to wasm"
license = "Apache-2.0"
edition = "2021"
readme = "readme.md"

[lib]
crate-type = ["cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# 2.2: the declaration's `type_records`.
arora-module = { path = "../../crates/arora-module", version = "2.3" }
# The derived types' records (`#[derive(AroraType)]`, 3.8).
arora-types = { path = "../../crates/arora-types", version = "3.8" }

[dev-dependencies]
anyhow = "*"
# The `module_dir` example: the module's records in arora-registry's layout
# (2.1: `add_declared_module`), and its header as JSON.
arora-registry = { path = "../../crates/arora-registry", version = "2.1" }
futures = "0.3"
serde_json = "1"
