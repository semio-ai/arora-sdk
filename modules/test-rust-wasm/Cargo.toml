[package]
name = "test-rust-wasm"
version = "0.1.0"
authors = ["Victor Paleologue <victor.paleologue@palaio.eu>"]
description = "A test module project compiled to wasm"
license = "Apache-2.0"
edition = "2021"
readme = "readme.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 2.3: `artifact!`.
arora-module = { path = "../../crates/arora-module", version = "2.3" }
# 3.8: the derived types' records.
arora-types = { path = "../../crates/arora-types", version = "3.8" }

[dev-dependencies]
anyhow = "*"
# The `module_dir` example. 2.1: `add_declared_module`.
arora-registry = { path = "../../crates/arora-registry", version = "2.1" }
futures = "0.3"
serde_json = "1"
