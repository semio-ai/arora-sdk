[workspace]
resolver = "2"

members = [
  "crates/arora",
  "crates/arora-animation",
  "crates/arora-geometry",
  "crates/arora-graphics-types",
  "crates/arora-dataflow-nodes",
  "modules/animation",
  "modules/polly",
  "modules/say-silent",
  "crates/arora-web",
  "modules/test-behavior-tree-nodes",
  "crates/arora-behavior-tree-types-yaml",
  "crates/arora-behavior-tree-types",
  "crates/arora-behavior-tree",
  "crates/arora-types",
  "crates/arora-types-derive",
  "crates/arora-module-macros",
  "crates/arora-module",
  "crates/arora-behavior",
  "crates/arora-simple-data-store",
  "crates/arora-hal",
  "crates/arora-hal-restful",
  "crates/arora-hal-ros2",
  "crates/arora-bridge",
  "crates/arora-engine",
  "crates/arora-buffers",
  "crates/arora-module-authoring/core",
  "crates/arora-module-authoring/cli",
  "crates/arora-module-authoring/cpp",
  "crates/arora-module-authoring/rust",
  "crates/arora-registry",
  "crates/arora-registry-remote",
  "crates/arora-cli",
  "crates/arora-util",
  "crates/arora-vfs",
  "crates/arora-bridge-ws",
  "crates/arora-bridge-ros2",
  "crates/arora-msgs-ros2",
  "crates/wasi-sdk",
  "modules/test-rust-wasm",
  "modules/test-rust-component",
  "modules/test-cpp",
  "modules/test-cpp-2",
  "examples/modules/cpp",
  "tests",
]

default-members = [
  "crates/arora",
  "crates/arora-animation",
  "crates/arora-geometry",
  "crates/arora-graphics-types",
  "crates/arora-dataflow-nodes",
  "modules/animation",
  "crates/arora-behavior-tree-types-yaml",
  "crates/arora-behavior-tree-types",
  "crates/arora-behavior-tree",
  "crates/arora-types",
  "crates/arora-types-derive",
  "crates/arora-module-macros",
  "crates/arora-module",
  "crates/arora-behavior",
  "crates/arora-simple-data-store",
  "crates/arora-hal",
  "crates/arora-hal-restful",
  "crates/arora-hal-ros2",
  "crates/arora-bridge",
  "crates/arora-engine",
  "crates/arora-buffers",
  "crates/arora-module-authoring/core",
  "crates/arora-module-authoring/cli",
  "crates/arora-module-authoring/cpp",
  "crates/arora-module-authoring/rust",
  "crates/arora-registry",
  "crates/arora-registry-remote",
  "crates/arora-cli",
  "crates/arora-util",
  "crates/arora-vfs",
  "crates/arora-bridge-ws",
  "crates/arora-bridge-ros2",
  "crates/arora-msgs-ros2",
  "crates/wasi-sdk",
  "modules/say-silent",
  "tests",
]

[profile.release]
lto = "thin"
debug = 1

# arora-studio-bridge-client (crates.io) depends on arora-types and arora-bridge;
# patching them to these crates keeps one copy of each, so their traits match.
[patch.crates-io]
arora-types = { path = "crates/arora-types" }
arora-bridge = { path = "crates/arora-bridge" }

