[package]
name = "arora-integration-tests"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "End-to-end tests that exercise built modules via arora-cli"

[lib]
path = "src/lib.rs"

# arora-cli and the Rust guests are artifact build-dependencies whose paths
# build.rs hands the tests. The C++ guests are dev-dependencies whose build
# scripts write their module directories under target/<profile>/modules.

[dev-dependencies]
anyhow = "1"
test-cpp = { path = "../modules/test-cpp" }
test-cpp-2 = { path = "../modules/test-cpp-2" }
example-cpp = { path = "../examples/modules/cpp" }

arora-engine = { path = "../crates/arora-engine" }
arora-buffers = { path = "../crates/arora-buffers" }
arora-types = { path = "../crates/arora-types", version = "3" }
yaml_serde = "0.10"
uuid = "1"
# The declared guest, host-side: its header and type records.
test-rust-wasm = { path = "../modules/test-rust-wasm" }
arora-animation-module = { path = "../modules/animation", version = "2", features = ["module-dir"] }
# The status and tick ids the behavior-tree node guest's calls carry.
arora-behavior = { path = "../crates/arora-behavior" }
arora-behavior-tree-types = { path = "../crates/arora-behavior-tree-types" }
serde_json = "1"
# A device loading the animation guest from its module directory.
arora = { path = "../crates/arora" }
arora-registry = { path = "../crates/arora-registry" }
futures = "0.3"
# Reads the guests' binaries, to check the C++ and Rust guests share one form.
wasmparser = "0.262"

[build-dependencies]
arora-animation-module = { path = "../modules/animation", artifact = "cdylib", target = "wasm32-wasip2" }
arora-cli = { path = "../crates/arora-cli", artifact = "bin" }
test-rust-wasm = { path = "../modules/test-rust-wasm", artifact = "cdylib", target = "wasm32-wasip2" }
test-rust-component = { path = "../modules/test-rust-component", artifact = "cdylib", target = "wasm32-wasip2" }
# Nothing else in the default build depends on this guest; building it here
# generates its `arora_generated` bindings, which `cargo fmt --check` needs.
test-behavior-tree-nodes = { path = "../modules/test-behavior-tree-nodes", artifact = "cdylib", target = "wasm32-wasip2" }

