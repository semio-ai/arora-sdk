[package]
name = "case-bt-nodes"
version = "0.0.0"
edition = "2021"
publish = false
description = "Study case: modules/test-behavior-tree-nodes declared in Rust — mutable parameters (written back as `mutated`) and the `children: Vec<TickId>` control-node parameter."

[dependencies]
arora-types = { workspace = true }
arora-module-derive = { workspace = true }
arora-module-support = { workspace = true }

# The guest shim's wire codec — only when built as a wasm guest.
[target.'cfg(target_arch = "wasm32")'.dependencies]
arora-buffers = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
serde_yaml = { workspace = true }
uuid = { workspace = true }
