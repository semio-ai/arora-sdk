[package]
name = "case-polly-outline"
version = "0.0.0"
edition = "2021"
publish = false
description = "Study case: polly declared in an out-of-line module (`mod polly;`), aggregated by `declare_module!` at the file's bottom."

[dependencies]
arora-types = { workspace = true }
arora-module-derive = { workspace = true }
arora-module-support = { workspace = true }

# The guest shim's wire codec — only when built as a wasm guest.
[target.'cfg(target_arch = "wasm32")'.dependencies]
arora-buffers = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
serde_yaml = { workspace = true }
uuid = { workspace = true }
