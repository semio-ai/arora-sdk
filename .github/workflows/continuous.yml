name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Tests build optimised, so wasmtime runs the guests at speed, but without
  # the cross-crate thin LTO and the debug info the release profile sets: every
  # test binary links wasmtime, and LTO over each of them is most of the build.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_DEBUG: line-tables-only

# Independent work runs as parallel jobs, each under its own time limit; a job
# none of whose packages a pull request reaches is skipped. A job reads the
# selection through `select`'s outputs, so a flag a job needs is listed there.
jobs:
  # A pull request builds and tests only the members its diff can reach
  # through cargo's dependency graph; main runs everything. The rules
  # (ignored files, inputs read across packages) live in the script.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      any: ${{ steps.affected.outputs.any }}
      test-args: ${{ steps.affected.outputs.test-args }}
      test-arora: ${{ steps.affected.outputs.test-arora }}
      test-arora-engine: ${{ steps.affected.outputs.test-arora-engine }}
      test-arora-web: ${{ steps.affected.outputs.test-arora-web }}
      build-arora-web: ${{ steps.affected.outputs.build-arora-web }}
      test-polly: ${{ steps.affected.outputs.test-polly }}
      test-arora-bridge-ros2: ${{ steps.affected.outputs.test-arora-bridge-ros2 }}
      test-arora-msgs-ros2: ${{ steps.affected.outputs.test-arora-msgs-ros2 }}
      test-arora-hal-ros2: ${{ steps.affected.outputs.test-arora-hal-ros2 }}
      test-arora-hal-restful: ${{ steps.affected.outputs.test-arora-hal-restful }}
      test-arora-hal-naoqi: ${{ steps.affected.outputs.test-arora-hal-naoqi }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The selection diffs against the merge base with the PR's base
          # branch, so it needs the history.
          fetch-depth: 0

      - name: Configure cargo git access
        run: |
          mkdir -p ~/.cargo
          echo "net.git-fetch-with-cli = true" >> ~/.cargo/config.toml
          echo "${{ secrets.GH_PAT_STUDIO_ARORA }}" > ~/.my-credentials
          git config --global credential.helper 'store --file ~/.my-credentials'

      - name: Select the packages this change affects
        id: affected
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then base="origin/$BASE_REF"; else base=--all; fi
          .github/scripts/list_modified_targets.sh "$base" >> "$GITHUB_OUTPUT"

  test:
    needs: select
    if: needs.select.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Configure cargo git access
        run: |
          mkdir -p ~/.cargo
          echo "net.git-fetch-with-cli = true" >> ~/.cargo/config.toml
          echo "${{ secrets.GH_PAT_STUDIO_ARORA }}" > ~/.my-credentials
          git config --global credential.helper 'store --file ~/.my-credentials'

      # Dependencies only: workspace members always rebuild. Main saves the
      # cache, pull requests restore it.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `cargo test --release` builds the wasm32-wasip2 guests automatically
      # via the integration-test crate's artifact dependencies (bindeps); the
      # tests locate them through the forwarded CARGO_CDYLIB_FILE_* env vars
      # (see tests/build.rs). No separate guest build step is needed.
      - name: Test (native + wasm modules via wasmtime)
        run: cargo test --release ${{ needs.select.outputs.test-args }}

      # Every file cargo tracked as an input of what was just built (rustc
      # dep-info, build-script rerun-if-changed) must select the package that
      # read it; otherwise the selection could skip a package a change
      # reaches. On failure it names the file and the INPUTS line to add.
      - name: Verify the selection covers every tracked input
        run: .github/scripts/list_modified_targets.sh verify

  # The ROS 2 bridge's Zenoh backend is off by default and exclusive with DDS,
  # so the test job never builds it. Its unit tests need no ROS, and its live
  # device test joins two in-process sessions over loopback; the one against a
  # native ROS 2 subscriber is `#[ignore]`d and documented.
  zenoh:
    needs: select
    if: needs.select.outputs.test-arora-bridge-ros2 || needs.select.outputs.test-arora-msgs-ros2
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Configure cargo git access
        run: |
          mkdir -p ~/.cargo
          echo "net.git-fetch-with-cli = true" >> ~/.cargo/config.toml
          echo "${{ secrets.GH_PAT_STUDIO_ARORA }}" > ~/.my-credentials
          git config --global credential.helper 'store --file ~/.my-credentials'

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test the ROS 2 bridge on the Zenoh backend
        run: cargo test --release -p arora-bridge-ros2 -p arora-msgs-ros2 --no-default-features --features zenoh

  # The robot runners (arora-ros2, arora-restful, arora-naoqi) build only
  # with their crates' `runner` feature, with or without their `studio`
  # feature (arora's Semio Studio connection, which decides whether a runner
  # contacts Studio, and builds only with arora's `studio-bridge`). The test
  # and lint jobs leave all of these off, so they would never be compiled.
  # Lint the runners and run their tests both ways whenever a change reaches
  # one of their crates.
  runners:
    needs: select
    if: needs.select.outputs.test-arora || needs.select.outputs.test-arora-hal-ros2 || needs.select.outputs.test-arora-hal-restful || needs.select.outputs.test-arora-hal-naoqi
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Line tables are enough for a failing test's backtrace, and keep three
      # linked runtimes within the runner's disk.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      RUNNERS: -p arora-hal-ros2 -p arora-hal-restful -p arora-hal-naoqi --features arora-hal-ros2/runner,arora-hal-restful/runner,arora-hal-naoqi/runner
      STUDIO_RUNNERS: -p arora-hal-ros2 -p arora-hal-restful -p arora-hal-naoqi --features arora-hal-ros2/runner,arora-hal-restful/runner,arora-hal-naoqi/runner,arora-hal-ros2/studio,arora-hal-restful/studio,arora-hal-naoqi/studio
    steps:
      - uses: actions/checkout@v6

      - name: Configure cargo git access
        run: |
          mkdir -p ~/.cargo
          echo "net.git-fetch-with-cli = true" >> ~/.cargo/config.toml
          echo "${{ secrets.GH_PAT_STUDIO_ARORA }}" > ~/.my-credentials
          git config --global credential.helper 'store --file ~/.my-credentials'

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy the robot runners
        run: cargo clippy $RUNNERS --all-targets -- -D warnings

      - name: Test the robot runners
        run: cargo test $RUNNERS --bins

      - name: Clippy the robot runners with Semio Studio
        run: cargo clippy $STUDIO_RUNNERS --all-targets -- -D warnings

      - name: Test the robot runners with Semio Studio
        run: cargo test $STUDIO_RUNNERS --bins

      - name: Clippy arora's Studio connection
        run: cargo clippy -p arora --features studio-bridge --all-targets -- -D warnings

      - name: Test arora's Studio connection
        run: "cargo test -p arora --features studio-bridge --lib -- studio:: run::"

  lint:
    needs: select
    if: needs.select.outputs.any == 'true' || needs.select.outputs.test-polly
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Configure cargo git access
        run: |
          mkdir -p ~/.cargo
          echo "net.git-fetch-with-cli = true" >> ~/.cargo/config.toml
          echo "${{ secrets.GH_PAT_STUDIO_ARORA }}" > ~/.my-credentials
          git config --global credential.helper 'store --file ~/.my-credentials'

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Clippy lints every target, tests included. It also runs the build
      # scripts that emit each crate's src/arora_generated.rs, which
      # `cargo fmt --check` needs: it errors on an unresolved
      # `mod arora_generated;` when those files are absent.
      - name: Clippy
        if: needs.select.outputs.any == 'true'
        run: cargo clippy ${{ needs.select.outputs.test-args }} --all-targets -- -D warnings

      # An unselected package has no changed file, so its formatting is
      # unchanged (a rustfmt.toml or toolchain change selects everything).
      - name: Check formatting
        if: needs.select.outputs.any == 'true'
        run: cargo fmt --check ${{ needs.select.outputs.test-args }}

      # polly stays out of the default members so the default build skips the
      # AWS SDK; it is linted, tests included, whenever a change reaches it.
      # Its tests call AWS Polly and stay ignored.
      - name: Clippy and formatting (polly)
        if: needs.select.outputs.test-polly
        run: |
          cargo clippy -p polly --all-targets -- -D warnings
          cargo fmt --check -p polly

  # The engine's web host (executor::browser) and the run loop's JS-timer
  # cadence only compile for wasm32, so the native jobs never exercise them.
  # Build and run them here, in a real headless browser.
  browser:
    needs: select
    if: needs.select.outputs.test-arora-engine || needs.select.outputs.test-arora || needs.select.outputs.test-arora-web || needs.select.outputs.build-arora-web
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Configure cargo git access
        run: |
          mkdir -p ~/.cargo
          echo "net.git-fetch-with-cli = true" >> ~/.cargo/config.toml
          echo "${{ secrets.GH_PAT_STUDIO_ARORA }}" > ~/.my-credentials
          git config --global credential.helper 'store --file ~/.my-credentials'

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the wasm32-unknown-unknown target and wasm-pack
        run: |
          rustup target add wasm32-unknown-unknown
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # geckodriver + firefox are preinstalled on ubuntu-latest.
      # --no-default-features drops the wasmtime/native hosts so the engine
      # builds for wasm32; the tests load the test-rust-component guest
      # through BrowserComponentExecutor and dispatch it (see
      # crates/arora-engine/tests/browser_component.rs).
      - name: Browser executor tests (headless Firefox)
        if: needs.select.outputs.test-arora-engine
        run: wasm-pack test --headless --firefox crates/arora-engine --no-default-features --test browser_component

      # The run loop's cadence rides a JS timer on wasm32 and Tokio's natively,
      # with the same guarantees either way; the test job covers the latter,
      # this the former.
      - name: Metronome cadence test (headless Firefox)
        if: needs.select.outputs.test-arora
        run: wasm-pack test --headless --firefox crates/arora --no-default-features --lib

      # The opinionated `arora` runtime must also compile for the browser:
      # arora-web wraps it (AroraRuntime) with no default features, selecting
      # the browser engine host and the Tokio-free runtime.
      - name: Build arora-web for wasm32 (opinionated runtime)
        if: needs.select.outputs.build-arora-web
        run: cargo build -p arora-web --target wasm32-unknown-unknown

      # arora-web's JS surface over the browser runtime.
      - name: arora-web browser test (headless Firefox)
        if: needs.select.outputs.test-arora-web
        run: wasm-pack test --headless --firefox crates/arora-web --lib --test browser

  # Line and region coverage of the native tests on main, as the job summary
  # and an lcov artifact; it gates nothing. docs/testing.md has the command and
  # what native coverage cannot see.
  coverage:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Configure cargo git access
        run: |
          mkdir -p ~/.cargo
          echo "net.git-fetch-with-cli = true" >> ~/.cargo/config.toml
          echo "${{ secrets.GH_PAT_STUDIO_ARORA }}" > ~/.my-credentials
          git config --global credential.helper 'store --file ~/.my-credentials'

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview

      # --coverage-target-only instruments the host target alone: the wasm32
      # guests the tests build as artifact dependencies cannot link the
      # profiler runtime.
      - name: Measure coverage
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          cargo llvm-cov --release --target "$host" --coverage-target-only --no-report
          cargo llvm-cov report --release --target "$host" --lcov --output-path lcov.info
          cargo llvm-cov report --release --target "$host" --summary-only > coverage.txt
          {
            echo '### Coverage'
            echo '```'
            tail -n 1 coverage.txt
            echo '```'
            echo '<details><summary>Per file</summary>'
            echo
            echo '```'
            cat coverage.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            coverage.txt

  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Run on the runner's own Node rather than through a Docker action: those
      # build from a Docker Hub image, whose anonymous pulls a shared runner
      # gets refused (429).
      - name: Check the links in every Markdown file
        run: |
          npm install --global markdown-link-check@3.13.7
          failed=0
          while IFS= read -r -d '' file; do
            markdown-link-check --quiet \
              --config .github/workflows/markdown-link-check-config.json "$file" || failed=1
          done < <(find . -type f -name '*.md' -not -path './node_modules/*' -print0)
          exit "$failed"
